[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nordic-close"
version = "0.1.0"
description = "Month-end close and consolidated reporting for a multi-currency Nordic group"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oktay Valiyev" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "xlsxwriter>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pip-audit>=2.7",
    "ruff>=0.5",
]

[project.scripts]
nordic-close = "nordic_close.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nordic_close = ["schema.sql", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov --cov-report=term:skip-covered"
# Tests open throwaway in-memory databases and let them go out of scope.
filterwarnings = ["ignore:unclosed database:ResourceWarning"]

[tool.coverage.run]
source = ["nordic_close"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S310", "S311", "E741"]
